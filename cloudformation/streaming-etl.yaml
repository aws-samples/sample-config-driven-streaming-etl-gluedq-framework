      ConnectionInput:
        Name: !Sub '${EnvironmentName}-msk-connection'
        ConnectionType: KAFKA
        ConnectionProperties:
          KAFKA_BOOTSTRAP_SERVERS: !GetAtt MSKBootstrapServersResource.BootstrapServers
          KAFKA_SSL_ENABLED: 'true'
        PhysicalConnectionRequirements:
          AvailabilityZone: !Select [0, !GetAZs '']
          SecurityGroupIdList:
            - !Ref GlueSecurityGroup
          SubnetId: !Ref PrivateSubnet1

  GlueStreamingJob:
    Type: AWS::Glue::Job
    DependsOn: GlueMSKConnection
    Properties:
      Name: !Sub '${EnvironmentName}-streaming-job'
      Description: Streaming ETL with native Glue Data Quality (DQDL), Transforms, and SCD2
      Role: !GetAtt GlueRole.Arn
      Command:
        Name: gluestreaming
        ScriptLocation: !Sub 's3://${AssetsBucket}/scripts/glue_streaming_job.py'
        PythonVersion: '3'
      DefaultArguments:
        '--job-language': python
        '--enable-glue-datacatalog': 'true'
        '--enable-continuous-cloudwatch-log': 'true'
        '--CONFIG_PATH': !Sub 's3://${AssetsBucket}/config/tables.yaml'
        # Native Glue Data Quality (awsgluedq) ships with the Glue runtime — no
        # Deequ JAR or PyDeequ wheel needed on Glue 6.0.
        # Only plain .py modules go in --extra-py-files (interpreter-agnostic).
        '--extra-py-files': !Sub 's3://${AssetsBucket}/scripts/glue_dq_analyzer.py,s3://${AssetsBucket}/scripts/dqdl_compiler.py'
        # pip-install runtime deps instead of shipping a version-specific wheel.
        # VERIFIED LIVE (2026-09-02, us-west-2): the Glue 6.0 gluestreaming
        # command can launch its Python runner on 3.11 even though the Glue 6.0
        # runtime documents Python 3.13 (batch/glueetl runs get 3.13). A cp313
        # wheel on the path plus runtime-provided boto3 both break under the
        # 3.11 runner (ModuleNotFoundError: boto3). pip resolves correct
        # artifacts for whichever interpreter actually runs. Requires NAT/PyPI
        # egress, which this VPC has.
        '--additional-python-modules': 'boto3==1.42.84,PyYAML==6.0.2'
        '--datalake-formats': delta
        # spark.sql.ansi.enabled=false: Spark 4.1 (Glue 6.0) enables ANSI mode by
        # default, which makes invalid casts THROW instead of producing NULL. Our
        # quarantine-first design relies on bad values surfacing as NULLs/rule
        # failures that get quarantined — not on crashing the stream.
        '--conf': 'spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension --conf spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog --conf spark.sql.ansi.enabled=false'
        '--SNS_TOPIC_ARN': !Ref DQAlertsTopic
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Connections:
        Connections:
          - !Ref GlueMSKConnection
      GlueVersion: '6.0'
      WorkerType: !Ref GlueWorkerType
      NumberOfWorkers: !Ref GlueNumberOfWorkers

  # ==========================================================================
  # Utility Lambdas
  # ==========================================================================
  
  # SQL Runner Lambda - Execute SQL against RDS PostgreSQL
  # NOTE: psycopg2 layer is added by deploy.sh after stack creation
  SQLRunnerFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - RDSInstance
      - LambdaDLQSendPolicy
    Properties:
      FunctionName: !Sub '${EnvironmentName}-sql-runner'
      Description: SQL runner utility for RDS PostgreSQL (psycopg2 layer added post-deploy)
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: !GetAtt SQLRunnerRole.Arn
      Timeout: 60
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDLQ.Arn
      ReservedConcurrentExecutions: 5
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          
          def lambda_handler(event, context):
              """
              SQL Runner Lambda - executes SQL against RDS PostgreSQL.
              Requires psycopg2 layer to be attached (done by deploy.sh).
              """
              try:
                  import psycopg2
              except ImportError:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': 'psycopg2 not available. Run deploy.sh to attach the layer.'
                      })
                  }
              
              sql = event.get('sql', '')
              if not sql:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'No SQL provided'})}
              
              # Get credentials from Secrets Manager
              secrets = boto3.client('secretsmanager')
              secret_arn = os.environ.get('RDS_SECRET_ARN')
              secret = json.loads(secrets.get_secret_value(SecretId=secret_arn)['SecretString'])
              
              host = os.environ.get('RDS_HOST')
              database = os.environ.get('RDS_DATABASE', 'etldb')
              user = secret.get('username', 'postgres')
              password = secret.get('password')
              
              try:
                  conn = psycopg2.connect(
                      host=host, database=database,
                      user=user, password=password,
                      connect_timeout=10
                  )
                  conn.autocommit = True
                  cur = conn.cursor()
                  cur.execute(sql)
                  
                  if cur.description:
                      columns = [desc[0] for desc in cur.description]
                      rows = cur.fetchall()
                      result = [dict(zip(columns, row)) for row in rows]
                  else:
                      result = {'rowcount': cur.rowcount}
                  
                  cur.close()
                  conn.close()
                  
                  return {'statusCode': 200, 'body': json.dumps(result, default=str)}
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          RDS_HOST: !GetAtt RDSInstance.Endpoint.Address
          RDS_DATABASE: etldb
          RDS_USER: postgres
          RDS_SECRET_ARN: !Ref RDSSecret
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2

  # Kafka Admin Lambda - Topic management via SASL/SCRAM
  # NOTE: kafka-python layer is added by deploy.sh after stack creation
  KafkaAdminFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - MSKBootstrapServersResource
      - LambdaDLQSendPolicy
    Properties:
      FunctionName: !Sub '${EnvironmentName}-kafka-admin'
      Description: Kafka admin utility for topic management (kafka-python layer added post-deploy)
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: !GetAtt KafkaAdminRole.Arn
      Timeout: 300
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDLQ.Arn
      ReservedConcurrentExecutions: 3
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          import yaml
          
          def lambda_handler(event, context):
              """
              Kafka Admin Lambda - manages Kafka topics.
              Requires kafka-python layer to be attached (done by deploy.sh).
              
              Actions:
                - list: List all topics
                - create: Create a single topic
                - info: Get connection info
                - sync_from_config: Create topics from tables.yaml config
              """
              try:
                  from kafka.admin import KafkaAdminClient, NewTopic
                  from kafka import KafkaConsumer
                  from kafka.errors import TopicAlreadyExistsError
              except ImportError:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': 'kafka-python not available. Run deploy.sh to attach the layer.',
                          'bootstrap_servers': os.environ.get('KAFKA_BOOTSTRAP', '')
                      })
                  }
              
              action = event.get('action', 'list')
              bootstrap = os.environ.get('KAFKA_BOOTSTRAP', '')
              username = os.environ.get('KAFKA_USERNAME', 'kafkaadmin')
              
              # Get password from Secrets Manager
              secrets = boto3.client('secretsmanager')
              secret_arn = os.environ.get('MSK_SECRET_ARN')
              secret = json.loads(secrets.get_secret_value(SecretId=secret_arn)['SecretString'])
              password = secret.get('password')
              
              kafka_config = {
                  'bootstrap_servers': bootstrap,
                  'security_protocol': 'SASL_SSL',
                  'sasl_mechanism': 'SCRAM-SHA-512',
                  'sasl_plain_username': username,
                  'sasl_plain_password': password,
              }
              
              try:
                  if action == 'list':
                      consumer = KafkaConsumer(**kafka_config)
                      topics = list(consumer.topics())
                      consumer.close()
                      return {'statusCode': 200, 'body': json.dumps({'topics': sorted(topics)})}
                  
                  elif action == 'create':
                      topic_name = event.get('topic')
                      partitions = event.get('partitions', 3)
                      replication = event.get('replication_factor', 2)
                      
                      if not topic_name:
                          return {'statusCode': 400, 'body': json.dumps({'error': 'topic name required'})}
                      
                      admin = KafkaAdminClient(**kafka_config)
                      new_topic = NewTopic(name=topic_name, num_partitions=partitions, replication_factor=replication)
                      try:
                          admin.create_topics([new_topic])
                          result = {'created': topic_name}
                      except TopicAlreadyExistsError:
                          result = {'exists': topic_name}
                      admin.close()
                      return {'statusCode': 200, 'body': json.dumps(result)}
                  
                  elif action == 'sync_from_config':
                      # Load config from S3
                      s3 = boto3.client('s3')
                      config_bucket = os.environ.get('CONFIG_BUCKET')
                      config_key = os.environ.get('CONFIG_KEY', 'config/tables.yaml')
                      
                      response = s3.get_object(Bucket=config_bucket, Key=config_key)
                      config = yaml.safe_load(response['Body'].read().decode('utf-8'))
                      
                      admin = KafkaAdminClient(**kafka_config)
                      consumer = KafkaConsumer(**kafka_config)
                      existing_topics = consumer.topics()
                      consumer.close()
                      
                      created = []
                      skipped = []
                      
                      for table in config.get('tables', []):
                          if table.get('internal', False):
                              continue
                          topic_name = table.get('topic')
                          if not topic_name:
                              continue
                          
                          if topic_name in existing_topics:
                              skipped.append(topic_name)
                          else:
                              new_topic = NewTopic(name=topic_name, num_partitions=3, replication_factor=2)
                              try:
                                  admin.create_topics([new_topic])
                                  created.append(topic_name)
                              except TopicAlreadyExistsError:
                                  skipped.append(topic_name)
                      
                      admin.close()
                      return {
                          'statusCode': 200,
                          'body': json.dumps({'created': created, 'skipped': skipped})
                      }
                  
                  elif action == 'info':
                      return {
                          'statusCode': 200,
                          'body': json.dumps({
                              'bootstrap_servers': bootstrap,
                              'username': username
                          })
                      }
                  
                  else:
                      return {'statusCode': 400, 'body': json.dumps({'error': f'Unknown action: {action}'})}
                      
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          KAFKA_BOOTSTRAP: !GetAtt MSKBootstrapServersResource.BootstrapServers
          KAFKA_USERNAME: kafkaadmin
          MSK_SECRET_ARN: !Ref MSKSecret
          CONFIG_BUCKET: !Ref AssetsBucket
          CONFIG_KEY: config/tables.yaml
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2

  # Athena Table Creator Lambda - Auto-create Athena tables for Delta Lake
  # Reads schema from tables.yaml in S3 - requires PyYAML layer (added by deploy.sh)
  # Runs in the VPC: Athena/Glue/S3 calls egress via the NAT gateway.
  AthenaTableCreatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaDLQSendPolicy
    Properties:
      FunctionName: !Sub '${EnvironmentName}-athena-table-creator'
      Description: Creates Athena tables for Delta Lake data (PyYAML layer added post-deploy)
      Runtime: python3.10
      Handler: index.lambda_handler
      Role: !GetAtt AthenaCreatorRole.Arn
      Timeout: 300
      MemorySize: 256
      ReservedConcurrentExecutions: 3
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDLQ.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import re
          import time
          
          def lambda_handler(event, context):
              """
              Create Athena tables for Delta Lake tables.
              Reads schema from tables.yaml + adds SCD2 columns from Glue.
              Requires PyYAML layer to be attached (done by deploy.sh).
              """
              try:
                  import yaml
              except ImportError:
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': 'PyYAML not available. Run deploy.sh to attach the layer.'
                      })
                  }
              
              s3 = boto3.client('s3')
              athena = boto3.client('athena')
              
              action = event.get('action', 'create_all')
              database = os.environ.get('GLUE_DATABASE')
              delta_bucket = os.environ.get('DELTA_BUCKET')
              config_bucket = os.environ.get('CONFIG_BUCKET')
              config_key = os.environ.get('CONFIG_KEY', 'config/tables.yaml')
              output_location = f's3://{config_bucket}/athena-results/'
              
              # SCD2 columns added by Glue streaming job
              SCD2_COLS = [
                  {'name': '_effective_from', 'type': 'timestamp'},
                  {'name': '_effective_to', 'type': 'timestamp'},
                  {'name': '_is_current', 'type': 'boolean'},
                  {'name': '_ingested_at', 'type': 'timestamp'},
                  {'name': '_operation', 'type': 'string'}
              ]
              
              # Type mapping from tables.yaml to Athena/Hive types
              TYPE_MAP = {
                  'integer': 'INT', 'int': 'INT',
                  'long': 'BIGINT', 'bigint': 'BIGINT',
                  'string': 'STRING', 'varchar': 'STRING', 'text': 'STRING',
                  'double': 'DOUBLE', 'float': 'DOUBLE', 'decimal': 'DOUBLE',
                  'boolean': 'BOOLEAN', 'bool': 'BOOLEAN',
                  'timestamp': 'TIMESTAMP', 'datetime': 'TIMESTAMP', 'date': 'DATE'
              }
              
              def load_config():
                  resp = s3.get_object(Bucket=config_bucket, Key=config_key)
                  return yaml.safe_load(resp['Body'].read().decode('utf-8'))
              
              def get_athena_type(col_type):
                  t = col_type.lower().strip()
                  # Preserve precision/scale for parametric decimal/numeric types
                  # (e.g. decimal(10,4)) so Athena matches the RDS DDL instead of
                  # silently falling through to STRING.
                  m = re.match(r'^(?:decimal|numeric)\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)$', t)
                  if m:
                      return 'DECIMAL({},{})'.format(m.group(1), m.group(2))
                  return TYPE_MAP.get(t, 'STRING')
              
              def build_columns(table_config):
                  cols = []
                  for col in table_config.get('schema', []):
                      athena_type = get_athena_type(col['type'])
                      cols.append(f"`{col['name']}` {athena_type}")
                  # Add SCD2 columns
                  for col in SCD2_COLS:
                      athena_type = get_athena_type(col['type'])
                      cols.append(f"`{col['name']}` {athena_type}")
                  return ', '.join(cols)
              
              def run_query(ddl):
                  try:
                      resp = athena.start_query_execution(
                          QueryString=ddl,
                          QueryExecutionContext={'Database': database},
                          ResultConfiguration={'OutputLocation': output_location}
                      )
                      qid = resp['QueryExecutionId']
                      for _ in range(30):
                          time.sleep(2)
                          r = athena.get_query_execution(QueryExecutionId=qid)
                          state = r['QueryExecution']['Status']['State']
                          if state in ['SUCCEEDED', 'FAILED', 'CANCELLED']:
                              return {'state': state, 'reason': r['QueryExecution']['Status'].get('StateChangeReason', '')}
                      return {'state': 'TIMEOUT'}
                  except Exception as e:
                      return {'state': 'ERROR', 'reason': str(e)}
              
              def create_table(table_config):
                  name = table_config['name']
                  location = f's3://{delta_bucket}/{name}/_symlink_format_manifest/'
                  columns = build_columns(table_config)
                  
                  # Drop existing table first to pick up changes
                  run_query(f'DROP TABLE IF EXISTS `{database}`.`{name}`')
                  
                  # Create table using symlink manifest (generated by Glue job)
                  # This works reliably across all Athena versions and regions
                  ddl = (
                      f"CREATE EXTERNAL TABLE `{database}`.`{name}` ({columns})"
                      f" ROW FORMAT SERDE 'org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe'"
                      f" STORED AS INPUTFORMAT 'org.apache.hadoop.hive.ql.io.SymlinkTextInputFormat'"
                      f" OUTPUTFORMAT 'org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat'"
                      f" LOCATION '{location}'"
                  )
                  return run_query(ddl)
              
              try:
                  config = load_config()
                  # Include every table with a Delta path — also internal ones
                  # like dq_metrics, so DQ results are queryable in Athena.
                  # (Internal tables have no Kafka topic, but they are real
                  # Delta tables and need Athena DDL like any other.)
                  tables = [t for t in config.get('tables', []) if t.get('delta_path')]
                  
                  # Ensure database exists
                  run_query(f'CREATE DATABASE IF NOT EXISTS `{database}`')
                  
                  if action == 'create_all':
                      results = {'created': [], 'failed': []}
                      for table in tables:
                          result = create_table(table)
                          if result['state'] == 'SUCCEEDED':
                              results['created'].append(table['name'])
                          else:
                              results['failed'].append({'table': table['name'], 'error': result.get('reason', result['state'])})
                      return {'statusCode': 200, 'body': json.dumps(results)}
                  
                  elif action == 'create':
                      table_name = event.get('table')
                      if not table_name:
                          return {'statusCode': 400, 'body': json.dumps({'error': 'table name required'})}
                      table_config = next((t for t in tables if t['name'] == table_name), None)
                      if not table_config:
                          return {'statusCode': 404, 'body': json.dumps({'error': f'table {table_name} not found'})}
                      result = create_table(table_config)
                      return {'statusCode': 200, 'body': json.dumps({'table': table_name, 'result': result})}
                  
                  elif action == 'drop':
                      table_name = event.get('table')
                      if not table_name:
                          return {'statusCode': 400, 'body': json.dumps({'error': 'table name required'})}
                      result = run_query(f'DROP TABLE IF EXISTS `{database}`.`{table_name}`')
                      return {'statusCode': 200, 'body': json.dumps({'table': table_name, 'result': result})}
                  
                  elif action == 'list':
                      return {'statusCode': 200, 'body': json.dumps({'tables': [t['name'] for t in tables]})}
                  
                  else:
                      return {'statusCode': 400, 'body': json.dumps({'error': f'Unknown action: {action}'})}
                      
              except Exception as e:
                  return {'statusCode': 500, 'body': json.dumps({'error': str(e)})}
      Environment:
        Variables:
          GLUE_DATABASE: !Ref GlueDatabaseName
          DELTA_BUCKET: !Ref DeltaBucket
          CONFIG_BUCKET: !Ref AssetsBucket
          CONFIG_KEY: config/tables.yaml

