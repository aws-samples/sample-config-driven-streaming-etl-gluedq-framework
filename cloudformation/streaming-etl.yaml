        - PolicyName: GlueLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws-glue/*'
        - PolicyName: GlueDQMetricsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # DQ metrics publishing: native EvaluateDataQuality publishes to
              # the Glue Data Quality namespace; the Spark fallback (used when
              # awsgluedq is unavailable, e.g. Glue 6.0 streaming runner)
              # publishes to StreamingETL/DataQuality. PutMetricData does not
              # support resource-level scoping, so restrict by namespace.
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace:
                      - StreamingETL/DataQuality
                      - Glue Data Quality
        - PolicyName: GlueCatalogAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetTables
